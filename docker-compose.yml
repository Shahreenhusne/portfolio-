services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hahreen_portfolio
      POSTGRES_PASSWORD: shahreen_1234
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - portfolio_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/portfolio"
      DATABASE_URL="postgresql://shahreen_portfolio:shahreen_1234@localhost:5432/portfolio"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-arparabbani@gmail.com}"
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL:-Portfolio Contact <onboarding@resend.dev>}"
    ports:
      - "3000:3000"

volumes:
  portfolio_db_data:
